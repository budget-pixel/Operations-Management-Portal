<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Budget Management Portal</title>
  <meta name="description" content="Submit budget transfer/amendment requests or fiscal year rollforward requests." />
  <link rel="icon" type="image/png" href="assets/images/walton-county-seal.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="home">

  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-seal">
          <img src="assets/images/walton-county-seal.png" alt="Walton County, Florida seal" />
        </span>
        <span class="brand-text">
          <span class="brand-top">Walton County</span>
          <span class="brand-bottom">Board of County Commissioners</span>
        </span>
      </div>
      <h1 class="page-title">Budget Management Portal</h1>
    </div>
  </header>

  <nav id="siteNav"></nav>

  <main class="page">

    <div class="hero">
      <h1>Budget Management Portal</h1>
      <p>Select the type of budget request you would like to submit.</p>
    </div>

    <!-- Cards rendered by js/landing.js from its REQUEST_TYPES array —
         add a new request type there, not here. -->
    <section id="landingCards" class="landing-cards"></section>

  </main>

  <script src="js/nav.js"></script>
  <script src="js/landing.js"></script>
</body>
</html>
