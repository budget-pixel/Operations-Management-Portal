<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#003e28" />
  <title>Work Orders Admin</title>
  <meta name="description" content="Manage locations, categories, and assignees for the Work Orders module." />
  <link rel="icon" type="image/png" href="assets/images/walton-county-seal.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="work-orders">

  <header class="site-header no-print">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="Walton County Board of County Commissioners home">
        <span class="brand-seal">
          <img src="assets/images/walton-county-seal.png" alt="Walton County, Florida seal" />
        </span>
        <span class="brand-text">
          <span class="brand-top">Walton County</span>
          <span class="brand-bottom">Board of County Commissioners</span>
        </span>
      </a>
      <nav id="siteNav" aria-label="Operations Management Portal"></nav>
      <button type="button" class="nav-menu-toggle" aria-label="Open navigation menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main class="page">

    <div class="portal-page-heading">
      <div class="page-eyebrow">Work Orders</div>
      <div class="portal-page-heading-row">
        <h1>Admin: Locations, Categories &amp; Assignees</h1>
        <a href="work-orders.html" class="btn btn-secondary no-print">Back to Work Orders</a>
      </div>
    </div>

    <p class="field-hint">
      These lists feed the dropdowns on the Work Order Request and Track Work Orders pages.
      This page is not access-restricted yet — anyone with the link can make changes here.
    </p>

    <div id="apiStatusBanner" class="banner banner-error no-print" hidden></div>

    <!-- One card per admin-managed list, rendered by js/workOrderAdmin.js
         from its RESOURCES array — add a new managed list there, not here. -->
    <section id="adminPanels" class="landing-cards"></section>

  </main>

  <script src="js/nav.js"></script>
  <script src="js/workOrderApi.js"></script>
  <script src="js/workOrderAdmin.js"></script>
</body>
</html>
